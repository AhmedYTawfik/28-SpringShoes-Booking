apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: booking
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: invoice-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - invoice-service.booking.svc.cluster.local:8080
