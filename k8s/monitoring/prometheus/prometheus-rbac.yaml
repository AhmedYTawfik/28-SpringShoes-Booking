apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-service-reader
  namespace: booking
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-service-reader-binding
  namespace: booking
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: monitoring
roleRef:
  kind: Role
  name: prometheus-service-reader
  apiGroup: rbac.authorization.k8s.io
