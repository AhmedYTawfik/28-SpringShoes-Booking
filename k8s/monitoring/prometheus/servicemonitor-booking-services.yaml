apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: booking-services-servicemonitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - booking
  selector:
    matchExpressions:
      - { key: app, operator: In, values: [user-service, provider-service, booking-service, calendar-service, invoice-service] }
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
