apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: booking-dashboards
        orgId: 1
        folder: Booking
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
  user-dashboard.json: |
    {
      "title": "User Service Dashboard",
      "uid": "user-service",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Error Rate (LogQL)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate({service=\"user-service\"} |= \"ERROR\" [5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Feign Call Outcomes (LogQL)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "{service=\"user-service\"} |~ \"Feign (GET|POST)\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "logs",
          "title": "RabbitMQ Event Audit (LogQL)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "{service=\"user-service\"} |~ \"(Published|Consuming|Processed)\"",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP Request Rate (PromQL)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"user-service\"}[5m])) by (uri, status)",
              "legendFormat": "{{uri}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "GET /api/users/* Latency P50/P95/P99 (PromQL)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{job=\"user-service\",uri=~\"/api/users/.*\"}[5m])) by (le))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"user-service\",uri=~\"/api/users/.*\"}[5m])) by (le))",
              "legendFormat": "P95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"user-service\",uri=~\"/api/users/.*\"}[5m])) by (le))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "HikariCP Connection Pool (PromQL)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 18 },
          "targets": [
            {
              "expr": "hikaricp_connections_active{job=\"user-service\"}",
              "legendFormat": "Active",
              "refId": "A"
            },
            {
              "expr": "hikaricp_connections_pending{job=\"user-service\"}",
              "legendFormat": "Pending",
              "refId": "B"
            },
            {
              "expr": "hikaricp_connections{job=\"user-service\"}",
              "legendFormat": "Total",
              "refId": "C"
            }
          ]
        }
      ]
    }
