apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: booking
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          ports:
            - containerPort: 9042
              name: cql
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: booking-cluster
            - name: CASSANDRA_DC
              value: datacenter1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: SimpleSnitch
            - name: JVM_OPTS
              value: "-Xms256m -Xmx512m"
            - name: MAX_HEAP_SIZE
              value: "512m"
            - name: HEAP_NEWSIZE
              value: "100m"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["cqlsh", "-e", "describe cluster"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
      volumes:
        - name: cassandra-data
          emptyDir: {}
