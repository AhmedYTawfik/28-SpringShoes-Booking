apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: calendar-postgres
  namespace: booking
spec:
  serviceName: calendar-postgres
  replicas: 1
  selector:
    matchLabels:
      app: calendar-postgres
  template:
    metadata:
      labels:
        app: calendar-postgres
    spec:
      containers:
        - name: calendar-postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: calendar-postgres-secret
          volumeMounts:
            - name: calendar-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: calendar-postgres-data
          persistentVolumeClaim:
            claimName: calendar-postgres-pvc
