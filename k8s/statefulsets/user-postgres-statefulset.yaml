apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-postgres
  namespace: booking
spec:
  serviceName: user-postgres
  replicas: 1
  selector:
    matchLabels:
      app: user-postgres
  template:
    metadata:
      labels:
        app: user-postgres
    spec:
      containers:
        - name: user-postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: user-postgres-secret
          volumeMounts:
            - name: user-postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: user-postgres-data
          persistentVolumeClaim:
            claimName: user-postgres-pvc
