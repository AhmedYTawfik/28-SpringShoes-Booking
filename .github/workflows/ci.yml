name: CI

on:
  push:
    branches:
      - "feat/**"
      - "feat/*"
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/springshoes-booking

jobs:
  build-test-docker:
    if: startsWith(github.ref_name, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven build and JUnit
        run: mvn -B clean verify

      - name: Docker build services
        run: |
          docker build -t springshoes-user-service:${{ github.sha }} ./user-service
          docker build -t springshoes-provider-service:${{ github.sha }} ./provider-service
          docker build -t springshoes-booking-service:${{ github.sha }} ./booking-service
          docker build -t springshoes-calendar-service:${{ github.sha }} ./calendar-service
          docker build -t springshoes-invoice-service:${{ github.sha }} ./invoice-service
          docker build -t springshoes-api-gateway:${{ github.sha }} ./api-gateway

  publish-images:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven build and JUnit
        run: mvn -B clean verify

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          for service in user-service provider-service booking-service calendar-service invoice-service api-gateway; do
            image="${REGISTRY}/${IMAGE_PREFIX}/${service}"
            docker build -t "${image}:${{ github.sha }}" -t "${image}:latest" "./${service}"
            docker push "${image}:${{ github.sha }}"
            docker push "${image}:latest"
          done
