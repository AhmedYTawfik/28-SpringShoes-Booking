services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

#  user-service:
#    build: ./user-service
#    ports:
#      - "8081:8080"  # Host:Container
#    environment:
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bookingdb
#    depends_on:
#      - postgres

  # dev-only — do not expose in staging/production
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: booking-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres

volumes:
  pgdata:
