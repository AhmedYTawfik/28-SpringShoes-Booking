server:
  port: 8080

spring:
  application:
    name: provider-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:provider-postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bookingdb-providers}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispass}
    mongodb:
      uri: mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:rootpass}@${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DATABASE:bookingmongo}?authSource=admin
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
  cache:
    type: redis
    redis:
      use-key-prefix: false

jwt:
  secret: ${JWT_SECRET:fJ8z2vK6yQ3pX9mR4wT5sN7bE1uI0aH8oL2cD6gV4eK3=}
  expiration: 86400000

feign:
  user-service:
    url: http://${FEIGN_USER_SERVICE_URL:user-service:8080}
  provider-service:
    url: http://${FEIGN_PROVIDER_SERVICE_URL:provider-service:8080}
  booking-service:
    url: http://${FEIGN_BOOKING_SERVICE_URL:booking-service:8080}
  calendar-service:
    url: http://${FEIGN_CALENDAR_SERVICE_URL:calendar-service:8080}
  invoice-service:
    url: http://${FEIGN_INVOICE_SERVICE_URL:invoice-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
