global:
  scrape_interval: 15s

# Day-0 placeholder. Service slices add Prometheus registry dependencies and
# enable /actuator/prometheus before these scrape targets become functional.
scrape_configs:
  - job_name: booking-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-service:8080
          - provider-service:8080
          - booking-service:8080
          - calendar-service:8080
          - invoice-service:8080
          - api-gateway:8080
